name: Distribution preparation
on:
  workflow_dispatch:
    inputs:
      upload_build:
        description: Archive and upload a build to App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'PyJWT[crypto]==2.10.1'
      - name: Inspect registered app and prepare API authentication
        run: python scripts/asc_inspect.py
      - name: Select newest stable installed Xcode
        run: |
          XCODE_PATH=$(python3 -c 'import glob,re; p=[x for x in glob.glob("/Applications/Xcode_*.app") if re.search(r"Xcode_[0-9.]+\.app$",x)]; print(max(p,key=lambda x:tuple(map(int,re.search(r"Xcode_([0-9.]+)\.app$",x)[1].split(".")))))')
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build simulator app for screenshots
        run: xcodebuild -scheme CivicRule -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build > build-screenshots.log 2>&1
      - name: Capture real iPhone and iPad screens
        timeout-minutes: 20
        run: bash scripts/capture-screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: build/screenshots
      - name: Archive signed app
        if: inputs.upload_build
        run: |
          set -o pipefail
          xcodebuild -scheme CivicRule -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/CivicRule.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Automatic -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" archive | tee archive.log
      - name: Export and upload to App Store Connect
        if: inputs.upload_build
        run: |
          python3 - <<'PY'
          import os,plistlib
          with open('build/ExportOptions.plist','wb') as f:
              plistlib.dump({'method':'app-store-connect','destination':'upload','teamID':os.environ['APPLE_TEAM_ID'],'signingStyle':'automatic','manageAppVersionAndBuildNumber':False,'uploadSymbols':True},f)
          PY
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/CivicRule.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee upload.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-diagnostics
          path: |
            build-screenshots.log
            archive.log
            upload.log
      - name: Remove temporary API key
        if: always()
        run: |
          if [ -n "$ASC_KEY_PATH" ]; then rm -f "$ASC_KEY_PATH"; fi
