name: CivicRule
options:
  bundleIdPrefix: com.civicrule
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  CivicRule:
    type: application
    platform: iOS
    sources: [CivicRule]
    info:
      path: CivicRule/Info.plist
      properties:
        CFBundleDisplayName: CivicRule AI
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSMicrophoneUsageDescription: Record a question only when you tap the microphone.
        NSSpeechRecognitionUsageDescription: Transcribe your spoken question on this device.
        NSCameraUsageDescription: Scan a notice you choose to explain.
        NSFaceIDUsageDescription: Unlock your private business records.
        NSLocationWhenInUseUsageDescription: Find the address of premises when you request it.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.civicrule.ios
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
  CivicRuleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CivicRuleTests]
    dependencies:
      - target: CivicRule
schemes:
  CivicRule:
    build:
      targets:
        CivicRule: all
    test:
      targets: [CivicRuleTests]
